# =============================================================
# DeepFake Detector — Production overrides (self-hosted on a VM)
#
# This profile assumes the database lives OUTSIDE Docker (Neon, RDS, etc.)
# and DATABASE_URL in .env points at it.
#
# Use:
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.prod.yml \
#     up -d --build
#
# What this file changes vs. the base compose:
#   - Disables the local Postgres container (Neon/RDS replaces it)
#   - Hides Redis, MinIO API, ClamAV, Flower from the public internet
#   - Adds CPU/memory limits + log rotation
#   - Forces APP_ENV=production for the backend
# =============================================================

name: deepfake-detector

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ----------------- Postgres (DISABLED in production) -----------------
  # We use a managed/external Postgres (Neon, RDS, etc.) instead.
  # The ``donotstart`` profile keeps this service defined but inactive.
  postgres:
    profiles: ["donotstart"]

  # ----------------- Redis (private) -----------------
  redis:
    ports: !reset []
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *default_logging

  # ----------------- MinIO (S3 API hidden, console on loopback) -----------------
  minio:
    ports: !override
      - "127.0.0.1:9001:9001"
    logging: *default_logging

  # ----------------- ClamAV (private) -----------------
  clamav:
    ports: !reset []
    logging: *default_logging

  # ----------------- Backend -----------------
  # `!override` REPLACES the depends_on map from the base compose file
  # (instead of merging into it), so the now-gone `postgres` reference
  # disappears entirely.
  backend:
    environment:
      APP_ENV: production
    depends_on: !override
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: *default_logging

  worker:
    depends_on: !override
      - backend
      - redis
      - minio
      - clamav
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    logging: *default_logging

  # ----------------- Flower (Celery dashboard, behind SSH tunnel) -----------------
  flower:
    ports: !override
      - "127.0.0.1:5555:5555"
    command: >
      celery -A app.workers.celery_app.celery_app flower --port=5555
      --basic_auth=${FLOWER_USER:?set FLOWER_USER}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD}
    logging: *default_logging

  frontend:
    logging: *default_logging
